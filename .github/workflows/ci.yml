name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.10.9"
  UV_SYNC: uv sync --frozen --extra cpu --extra train --extra serve

jobs:
  quality:
    name: lint, types, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: ${{ env.UV_SYNC }}
      - name: ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: mypy
        run: uv run mypy
      - name: pytest
        run: uv run pytest -m "not slow and not network" --cov=decider --cov-report=term-missing:skip-covered

  pipeline:
    name: smoke pipeline (build, train, evaluate, serve)
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: ${{ env.UV_SYNC }}
      - name: build data
        run: uv run decider-build-data data=smoke
      - name: train
        run: uv run decider-train experiment=smoke run_dir=runs/smoke/ci train.device=cpu
      - name: evaluate bundle
        run: uv run decider-eval --bundle runs/smoke/ci/bundle --data data/processed/smoke --device cpu
      - name: serve and query
        run: |
          uv run decider-serve --bundle runs/smoke/ci/bundle --device cpu --port 8000 &
          for i in $(seq 1 30); do curl -sf localhost:8000/readyz && break; sleep 1; done
          curl -sf -X POST localhost:8000/v1/decide -H 'content-type: application/json' \
            -d '{"state": {"items": [{"name": "lamp", "color": "red", "qty": 2}]},
                 "questions": {"red": {"type": "noul", "instructions": "Is there a red item?"}}}'
          curl -sf localhost:8000/metrics/ | grep decider_requests_total
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-report
          path: |
            runs/smoke/ci/eval
            runs/smoke/ci/metrics.jsonl
          if-no-files-found: ignore

  docker:
    name: serving image
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: false
          tags: decider-serve:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  monitoring:
    name: monitoring stack (Prometheus rules, Grafana provisioning)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: validate Prometheus config and alert rules
        run: |
          docker run --rm -v "$PWD/docker/prometheus:/etc/prometheus:ro" --entrypoint promtool \
            prom/prometheus:v3.5.0 check config /etc/prometheus/prometheus.yml
      - name: start Prometheus and Grafana
        run: docker compose -f docker/docker-compose.yml up -d prometheus grafana
      - name: dashboards are provisioned and rules are loaded
        run: |
          for i in $(seq 1 60); do curl -sf localhost:3000/api/health && break; sleep 2; done
          dashboards=$(curl -sf -u admin:admin "localhost:3000/api/search?tag=decider" | jq length)
          echo "dashboards: $dashboards"; test "$dashboards" -eq 2
          for i in $(seq 1 30); do curl -sf localhost:9090/-/ready && break; sleep 2; done
          groups=$(curl -sf localhost:9090/api/v1/rules | jq '.data.groups | length')
          echo "rule groups: $groups"; test "$groups" -eq 2
      - if: failure()
        run: docker compose -f docker/docker-compose.yml logs
      - if: always()
        run: docker compose -f docker/docker-compose.yml down -v
