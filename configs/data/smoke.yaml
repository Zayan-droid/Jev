# Tiny dataset for CI and smoke tests.
name: smoke
output_root: data/processed
seed: 0
val_fraction: 0.0
calib_fraction: 0.0
sources: []
synthetic:
  families: [inventory, arithmetic, dates, lookup]
  heldout_families: [dates]
  heldout_templates: [inv.most_common_color]
  questions_per_record: [1, 3]
  negation_rate: 0.2
  injection_rate: 0.2
synthetic_sizes:
  train: 400
  val: 60
  calib: 60
  test: 80
  heldout: 60
