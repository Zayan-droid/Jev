# Monitoring stack: Prometheus + Grafana, provisioned with the decider dashboards.
#   docker compose -f docker/docker-compose.yml up -d            # monitoring only
#   docker compose -f docker/docker-compose.yml --profile api up -d  # + containerised API
# Prometheus scrapes the trainer (:9101) and the API (:8000) on the host, and the `api`
# service when that profile is enabled. Grafana: http://localhost:3000 (read-only without
# login; admin / admin to edit).

name: decider

services:
  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    ports: ["9090:9090"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.1.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      # Local stack: dashboards are readable without logging in; editing needs admin.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/decider-training.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports: ["3000:3000"]
    depends_on: [prometheus]
    restart: unless-stopped

  api:
    profiles: [api]
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: decider-serve:latest
    # The review queue lives on the logs volume so it survives container restarts.
    command: ["--feedback-queue", "logs/review-queue.jsonl"]
    volumes:
      - ${DECIDER_BUNDLE_DIR:-../runs/latest/bundle}:/models/bundle:ro
      - api-logs:/home/decider/logs
    ports: ["8001:8000"]
    restart: unless-stopped

volumes:
  prometheus-data:
  grafana-data:
  api-logs:
