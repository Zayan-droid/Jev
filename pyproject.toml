[project]
name = "decider"
version = "0.1.0"
description = "A calibrated, single-pass decision model: typed questions in, probability distributions out."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
keywords = ["transformer", "calibration", "classification", "zero-shot", "mlops"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "huggingface-hub>=0.30",
    "numpy>=2.0",
    "pydantic>=2.9",
    "rich>=13.9",
    "safetensors>=0.4.5",
    "tokenizers>=0.21",
]

[project.optional-dependencies]
# PyTorch build, pick exactly one: `cu128` on a CUDA 12.8 machine, `cpu` for CI and images.
cpu = ["torch>=2.11,<2.12"]
cu128 = ["torch>=2.11,<2.12"]
# Data building, training, evaluation and experiment tracking.
train = [
    "datasets>=3.6",
    "hydra-core>=1.3.2",
    "matplotlib>=3.9",
    "mlflow>=3.1",
    "nvidia-ml-py>=12.560",
    "omegaconf>=2.3",
    "prometheus-client>=0.21",
    "psutil>=6.0",
]
# The HTTP inference server.
serve = [
    "fastapi>=0.115",
    "prometheus-client>=0.21",
    "uvicorn[standard]>=0.32",
]

[project.scripts]
decider-build-data = "decider.cli.build_data:main"
decider-train = "decider.cli.train:main"
decider-eval = "decider.cli.evaluate:main"
decider-bench = "decider.cli.bench:main"
decider-register = "decider.cli.register:main"
decider-serve = "decider.cli.serve:main"
decider-label = "decider.cli.label:main"
decider-monitor = "decider.cli.monitor:main"
decider-compare = "decider.cli.compare:main"

[dependency-groups]
dev = [
    "httpx>=0.28",
    "transformers>=4.53", # reference implementation for the ModernBERT parity test
    "mypy>=1.13",
    "poethepoet>=0.31",
    "pre-commit>=4.0",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
]
pipeline = ["dvc>=3.55"]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/decider"]

[tool.uv]
default-groups = ["dev"]
conflicts = [[{ extra = "cpu" }, { extra = "cu128" }]]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu128", extra = "cu128" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "PTH", "NPY"]
ignore = [
    "N812", # `import torch.nn.functional as F` is the PyTorch convention
    "RUF001",
    "RUF002",
    "RUF003",
    "NPY002", # seeding the legacy global NumPy RNG is intentional (third-party code uses it)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["N802", "N806"]

[tool.mypy]
python_version = "3.12"
files = ["src/decider"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "slow: long-running tests (deselect with -m 'not slow')",
    "network: tests that download models or datasets",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["decider"]
branch = true

[tool.poe.tasks]
lint = { shell = "ruff check . && ruff format --check ." }
fmt = { shell = "ruff check --fix . && ruff format ." }
typecheck = "mypy"
test = "pytest -m 'not slow and not network'"
test-all = "pytest"
data-toy = "decider-build-data data=toy"
data-mix = "decider-build-data data=mix-v0"
train-smoke = "decider-train experiment=smoke"
train-toy = "decider-train experiment=toy"
train-mix = "decider-train experiment=modernbert-mix"
mlflow = "mlflow server --backend-store-uri sqlite:///mlflow/mlflow.db --artifacts-destination ./mlflow/artifacts --host 127.0.0.1 --port 5000"
monitoring = "docker compose -f docker/docker-compose.yml up -d"
